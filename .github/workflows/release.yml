name: Release signed Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.1.2'
        required: true
        default: '1.1.6'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "$VERSION" != "$APP_VERSION" ]]; then
            echo "Requested/tag version $VERSION does not match app version $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$ANDROID_KEYSTORE"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/mobilemonitor-release.jks"

      - name: Build signed release APK
        env:
          MM_STORE_FILE: ${{ runner.temp }}/mobilemonitor-release.jks
          MM_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          echo "$PACKAGE_LINE"
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*$/\1/p' app/build.gradle.kts)"
          test -n "$VERSION_CODE"
          [[ "$PACKAGE_LINE" == *"name='com.codeappathy.mobilemonitor'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='$VERSION_CODE'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='$VERSION'"* ]]
          echo "Signed APK signature and package metadata verified."

      - name: Prepare release files and checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/MobileMonitorApp-${VERSION}.apk"
          (cd release && sha256sum "MobileMonitorApp-${VERSION}.apk" > SHA256SUMS.txt)

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileMonitorApp-${{ steps.version.outputs.version }}-signed
          path: |
            release/MobileMonitorApp-${{ steps.version.outputs.version }}.apk
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "release/MobileMonitorApp-${VERSION}.apk" \
            "release/SHA256SUMS.txt" \
            --title "MobileMonitorApp ${VERSION}" \
            --generate-notes
